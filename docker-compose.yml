services:

  # ── Reverse Proxy ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ── Frontend (static HTML/CSS/JS) ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "80"

  # ── Backend (FastAPI + Gunicorn) ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-assistant_db}
      CHROMA_DB_PATH: /app/chroma_db
      UPLOAD_DIR: /tmp/uploads
      ENVIRONMENT: production
    volumes:
      - chroma_data:/app/chroma_db
      - upload_data:/tmp/uploads
      - log_data:/app/logs
      # Google OAuth files (place credentials.json + token.pickle in project root)
      - ./credentials.json:/app/credentials.json:ro
      - ./token.pickle:/app/token.pickle:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-assistant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── ChromaDB (RAG vector store) ──────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    expose:
      - "8001"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  upload_data:
  log_data:

# /etc/nginx/sites-available/ai-action-assistant
# Nginx reverse proxy for AI Action Assistant on EC2
#
# Setup:
#   sudo cp nginx.conf /etc/nginx/sites-available/ai-action-assistant
#   sudo ln -s /etc/nginx/sites-available/ai-action-assistant /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.yourdomain.com   # free SSL via Let's Encrypt
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS + reverse proxy ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload size limit (matches UPLOAD_MAX_BYTES = 10MB)
    client_max_body_size 12M;

    # Timeouts for long-running LLM requests
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    # ── API proxy ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer settings for streaming responses
        proxy_buffering    off;
        proxy_buffer_size  4k;
    }

    # ── Health check (no auth, used by ALB target group) ──────
    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Static files (served directly by Nginx for speed) ─────
    # Uncomment if you want Nginx to serve static files directly
    # instead of proxying to FastAPI
    # location /static/ {
    #     alias /app/static/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
}

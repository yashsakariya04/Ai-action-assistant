<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — AI Action Assistant</title>
<link rel="stylesheet" href="/static/design-system.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="auth-page page-enter">

<div class="auth-glow" aria-hidden="true"></div>

<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-mark">
      <i data-lucide="sparkles" class="icon-md"></i>
    </div>
    <div>
      <div class="auth-logo-title">AI Action Assistant</div>
      <div class="auth-logo-sub">Production · Agentic AI</div>
    </div>
  </div>

  <hr class="auth-divider">

  <h1 class="auth-heading">Welcome back</h1>
  <p class="auth-subheading">Sign in to your account to continue</p>

  <div class="error-banner" id="error-msg">
    <i data-lucide="alert-circle" class="icon-sm"></i>
    <span id="error-text"></span>
  </div>

  <form class="auth-form" onsubmit="handleLogin(event)">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
    </div>
    <button class="btn-primary" type="submit" id="submit-btn">Sign In</button>
  </form>

  <p class="auth-footer">Don't have an account? <a href="/signup">Create one</a></p>
</div>

<script>
const API_BASE = (typeof window.API_BASE_URL !== 'undefined' && window.API_BASE_URL)
  ? window.API_BASE_URL
  : window.location.origin;

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  const errText = document.getElementById('error-text');
  err.classList.remove('visible');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username: email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = res.status === 401
        ? 'Invalid email or password. If you just set up the server, please create a new account.'
        : (data.detail || 'Login failed.');
      showError(msg);
      return;
    }
    localStorage.setItem('ai_user_id', data.user_id);
    localStorage.setItem('ai_email', data.email);
    localStorage.setItem('ai_name', data.name || data.email.split('@')[0]);
    window.location.href = '/dashboard';
  } catch {
    showError('Could not reach the server. Is it running?');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function showError(msg) {
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-msg').classList.add('visible');
}

(async function () {
  try {
    const res = await fetch(API_BASE + '/auth/me', { credentials: 'include' });
    if (res.ok) window.location.href = API_BASE + '/dashboard';
  } catch { /* not logged in */ }
})();

lucide.createIcons();
</script>
</body>
</html>

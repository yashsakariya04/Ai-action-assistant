<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — AI Action Assistant</title>
<link rel="stylesheet" href="/static/design-system.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="auth-page page-enter">

<div class="auth-glow" aria-hidden="true"></div>

<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-mark">
      <i data-lucide="sparkles" class="icon-md"></i>
    </div>
    <div>
      <div class="auth-logo-title">AI Action Assistant</div>
      <div class="auth-logo-sub">Production · Agentic AI</div>
    </div>
  </div>

  <hr class="auth-divider">

  <h1 class="auth-heading">Create your account</h1>
  <p class="auth-subheading">Start using AI Action Assistant</p>

  <div class="error-banner" id="error-msg">
    <i data-lucide="alert-circle" class="icon-sm"></i>
    <span id="error-text"></span>
  </div>

  <form class="auth-form" onsubmit="handleSignup(event)">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Your name" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password" minlength="8">
      <p class="field-hint">Minimum 8 characters</p>
    </div>
    <button class="btn-primary" type="submit" id="submit-btn">Create Account</button>
  </form>

  <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
</div>

<script>
async function handleSignup(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  err.classList.remove('visible');
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (password.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, name: name || null }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(typeof data.detail === 'string' ? data.detail : 'Registration failed.');
      return;
    }
    localStorage.setItem('ai_user_id', data.user_id);
    localStorage.setItem('ai_email', data.email);
    localStorage.setItem('ai_name', data.name || data.email.split('@')[0]);
    window.location.href = '/dashboard';
  } catch {
    showError('Could not reach the server. Is it running?');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}

function showError(msg) {
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-msg').classList.add('visible');
}

(async function () {
  try {
    const res = await fetch('/auth/me', { credentials: 'include' });
    if (res.ok) window.location.href = '/dashboard';
  } catch { /* not logged in */ }
})();

lucide.createIcons();
</script>
</body>
</html>
